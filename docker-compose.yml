services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: circuito
      POSTGRES_PASSWORD: circuito123
      POSTGRES_DB: circuito_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuito"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://circuito:circuito123@db:5432/circuito_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
